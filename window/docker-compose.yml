# cloud-provider-kind — LoadBalancer + Gateway API for kind
#
# Started by START-HERE.bat menu [1] Install or [2] Start services
# Stopped by menu [5] Stop, [6] Remove kind, or [7] Full removal
# Folder path auto-detected — project can live anywhere on your PC
#
# Requires: kind cluster running (creates Docker network "kind")
#
# Manual: docker compose up -d  |  docker compose down
# Docs:   https://github.com/kubernetes-sigs/cloud-provider-kind

services:
  cloud-provider-kind:
    image: registry.k8s.io/cloud-provider-kind/cloud-controller-manager:v0.11.1
    container_name: cloud-provider-kind
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - kind

networks:
  kind:
    external: true
